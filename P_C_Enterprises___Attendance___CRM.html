function dl(b,n){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
function toCSV(R){const c=Object.keys(clean(R[0])),q=v=>{v=String(inj(v??''));return/[",\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};return'\ufeff'+[c.map(q).join(','),...R.map(r=>{r=clean(r);return c.map(k=>q(r[k])).join(',')})].join('\r\n')}
async function xlsx(ps){await lib(EJ);const wb=new ExcelJS.Workbook(),t=ist();wb.creator='P&C Enterprises';const inf=wb.addWorksheet('Export Info');
[['P&C Enterprises – Data Export'],['Exported (IST)',t.date+' '+t.time],['Date range',(X.from||'Any')+' to '+(X.to||'Any')],['Exported by',me.name+' ('+me.role+')'],...ps.map(p=>[p.label,p.R.length+' records'])].forEach(r=>inf.addRow(r));
inf.getRow(1).font={bold:true,size:14,color:{argb:'FFB91C1C'}};inf.getColumn(1).width=34;inf.getColumn(2).width=32;
for(const p of ps){const ws=wb.addWorksheet(p.label.slice(0,31)),R=p.R.map(clean),c=Object.keys(R[0]);
ws.columns=c.map(k=>({header:k,key:k,width:Math.min(45,Math.max(k.length+4,...R.slice(0,200).map(r=>String(r[k]??'').length+2))),style:{numFmt:isD(k)?'dd-mmm-yyyy':/Amount/.test(k)?'"₹"#,##0.00':k==='Hours'?'0.00':'@'}}));
R.forEach(r=>ws.addRow(c.map(k=>isD(k)&&r[k]?new Date(r[k]+'T00:00:00Z'):inj(r[k]))));
const hr=ws.getRow(1);hr.font={bold:true,color:{argb:'FFFFFFFF'}};hr.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFB91C1C'}};
ws.autoFilter={from:{row:1,column:1},to:{row:1,column:c.length}};ws.views=[{state:'frozen',ySplit:1}]}
return new Blob([await wb.xlsx.writeBuffer()],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})}
async function pdf(ps,title){await lib(PJ);await lib(PA);const d=new window.jspdf.jsPDF({orientation:'landscape',unit:'pt',format:'a4'}),t=ist(),rs=s=>String(s??'').replace(/₹/g,'Rs ');
const hd=()=>{d.setFillColor(185,28,28);d.rect(0,0,842,46,'F');d.setTextColor(255);d.setFontSize(15);d.text('P&C Enterprises',30,29);d.setFontSize(10);d.text(title,812,29,{align:'right'});d.setTextColor(17,24,39)};
ps.forEach((p,i)=>{if(i)d.addPage();hd();d.setFontSize(13);d.text(p.label,30,72);d.setFontSize(9);d.text(`Generated ${t.date} ${t.time} IST · Period: ${X.from||'Any'} to ${X.to||'Any'} · ${p.R.length} records`,30,88);
const R=p.R.map(clean),c=Object.keys(R[0]);d.autoTable({startY:98,head:[c.map(rs)],body:R.map(r=>c.map(k=>rs(r[k]))),styles:{fontSize:8},headStyles:{fillColor:[185,28,28]},margin:{top:56,left:30,right:30},didDrawPage:hd})});
const n=d.getNumberOfPages();for(let i=1;i<=n;i++){d.setPage(i);d.setFontSize(8);d.setTextColor(17,24,39);d.text(`Page ${i} of ${n}`,812,575,{align:'right'})}return d.output('blob')}
/* Google Sheets (browser-side OAuth token flow: needs only a Client ID, no secret) */
const GS=()=>{try{return JSON.parse(localStorage.getItem('pc_gs')||'{}')}catch(e){return{}}};let tok=null,tokExp=0;
async function gtoken(){const g=GS();if(!g.cid)throw new Error('Enter your Google OAuth Client ID first');if(tok&&Date.now()<tokExp)return tok;await lib('https://accounts.google.com/gsi/client');
return new Promise((res,rej)=>google.accounts.oauth2.initTokenClient({client_id:g.cid,scope:'https://www.googleapis.com/auth/spreadsheets',callback:r=>{if(r.error)return rej(new Error(r.error_description||r.error));tok=r.access_token;tokExp=Date.now()+(r.expires_in-60)*1000;res(tok)},error_callback:e=>rej(new Error(e.message||'Google sign-in cancelled'))}).requestAccessToken())}
async function gapi(path,o={}){const t=await gtoken(),r=await fetch('https://sheets.googleapis.com/v4/spreadsheets'+path,{...o,headers:{Authorization:'Bearer '+t,'Content-Type':'application/json'}});if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(j.error&&j.error.message||'Google API error '+r.status)}return r.json()}
async function gsync(ps){const g=GS();let sid=g.sid,ok_=0,fail=0,err='';
if(!sid){sid=(await gapi('',{method:'POST',body:JSON.stringify({properties:{title:'P&C Enterprises Data '+today()}})})).spreadsheetId;localStorage.setItem('pc_gs',JSON.stringify({...g,sid}))}
const have=(await gapi('/'+sid+'?fields=sheets.properties.title')).sheets.map(s=>s.properties.title),add=ps.filter(p=>!have.includes(p.label));
if(add.length)await gapi('/'+sid+':batchUpdate',{method:'POST',body:JSON.stringify({requests:add.map(p=>({addSheet:{properties:{title:p.label}}}))})});
for(const p of ps){try{const T=p.label,c=Object.keys(clean(p.R[0])),cur=(await gapi('/'+sid+'/values/'+encodeURIComponent(`'${T}'!A:A`))).values||[],idx=new Map(cur.map((v,i)=>[v[0],i+1])),data=[],app=[];
if(!cur.length)data.push({range:`'${T}'!A1`,values:[['Record ID',...c]]});
p.R.forEach(r=>{const v=[r._id,...c.map(k=>String(clean(r)[k]??''))];idx.has(r._id)?data.push({range:`'${T}'!A${idx.get(r._id)}`,values:[v]}):app.push(v)});
if(data.length)await gapi('/'+sid+'/values:batchUpdate',{method:'POST',body:JSON.stringify({valueInputOption:'RAW',data})});
if(app.length)await gapi('/'+sid+'/values/'+encodeURIComponent(`'${T}'!A1`)+':append?valueInputOption=RAW&insertDataOption=INSERT_ROWS',{method:'POST',body:JSON.stringify({values:app})});ok_+=p.R.length}catch(e){fail+=p.R.length;err=e.message}}
S.exp.gs={at:new Date().toISOString(),ok:ok_,fail,msg:err||'Success'};sv();return{sid,fail,err}}
async function run(t,fmt){const ps=pack().filter(p=>p.R.length);if(!ps.length)return toast('Select a category with matching records first');
const n=ps.reduce((s,p)=>s+p.R.length,0),mod=ps.map(p=>p.label).join(', '),fn=`PC_Enterprises_${ps.length===1?ps[0].label.replace(/\W+/g,'_'):'Complete_Report'}_${today()}`;t.disabled=true;t.textContent='Working…';let dest='';
try{if(fmt==='Excel')dl(await xlsx(ps),fn+'.xlsx');else if(fmt==='PDF')dl(await pdf(ps,ps.length>1?'Management Summary':ps[0].label),fn+'.pdf');
else if(fmt==='CSV')for(const p of ps){dl(new Blob([toCSV(p.R)],{type:'text/csv;charset=utf-8'}),`PC_Enterprises_${p.label.replace(/\W+/g,'_')}_${today()}.csv`);await new Promise(r=>setTimeout(r,500))}
else{const r=await gsync(ps);dest='https://docs.google.com/spreadsheets/d/'+r.sid;if(r.fail)throw new Error(r.err)}
rec(mod,fmt,n,'Success',dest);toast(`${fmt}: ${n} records exported`)}catch(e){rec(mod,fmt,n,'Failed',dest);toast('Failed: '+e.message)}render()}
function expV(){const A=Object.keys(CATS).filter(ok),g=GS(),gs=S.exp.gs||{},H=S.exp.h.filter(e=>me.role==='Super Admin'||e.uid===me.id),B=(a,l,c='')=>`<button class="b ${c}" data-x=${a}>${l}</button>`,live=tok&&Date.now()<tokExp;
return`<div class=grid>${K('Available records',A.reduce((s,k)=>s+CATS[k][2]().length,0))}${K('Total exports',H.length)}${K('Last export',H[0]?H[0].at.slice(0,10):'-')}${K('Google Sheets',!g.cid?'Not set up':live?'Connected':'Sign-in needed')}${K('Last sync',gs.at?(gs.fail?'Failed':'OK'):'-')}${K('Failed exports',H.filter(e=>e.status!=='Success').length)}</div>
<div class=card><h3>Data Export &amp; Reports</h3><div class=row>${A.map(k=>`<label><input type=checkbox style="width:auto" data-xc=${k} ${X.sel.has(k)?'checked':''}> ${CATS[k][0]}</label>`).join('')}</div>${me.role==='Super Admin'?'<p>'+B('all','Complete database (select all)','s x')+'</p>':''}
<div class=row><label class=m>From<input type=date data-xf=from value="${X.from}"></label><label class=m>To<input type=date data-xf=to value="${X.to}"></label><label class=m>Employee / assignee<select data-xf=emp><option value="">All${scope().map(u=>`<option value=${u.id} ${X.emp===u.id?'selected':''}>${esc(u.name)}`).join('')}</select></label><label class=m>Status contains<input data-xf=st value="${esc(X.st)}" placeholder="e.g. Late, Paid, Pending"></label></div>
<p>${B('pv','Preview Data','x')} ${B('xl','Export to Excel')} ${B('csv','Download CSV')} ${B('pdf','Generate PDF')} ${B('gs','Sync Now (Google Sheets)','g')}</p></div>
${X.pv?X.pv.map(p=>{const R=p.R.slice(0,25).map(clean),c=R[0]?Object.keys(R[0]):[];return`<div class=card><h3>${p.label} (${p.R.length} records)</h3><div class=w><table><tr>${c.map(x=>`<th>${esc(x)}`).join('')}</tr>${R.map(r=>`<tr>${c.map(x=>`<td>${esc(r[x])}`).join('')}</tr>`).join('')||'<tr><td class=m>No records match</tr>'}</table></div>${p.R.length>25?'<p class=m>Showing first 25 rows.</p>':''}</div>`}).join(''):''}
<div class=card><h3>Google Sheets</h3><div class=row><input id=gcid placeholder="Google OAuth Client ID" value="${esc(g.cid||'')}"><input id=gsid placeholder="Spreadsheet link or ID (blank = create new)" value="${esc(g.sid||'')}">${B('gsave','Save &amp; connect','x')}</div><p class=m>${gs.at?`Last sync ${new Date(gs.at).toLocaleString('en-IN',{timeZone:'Asia/Kolkata'})}: ${gs.ok} exported, ${gs.fail} failed. ${esc(gs.msg||'')}`:'Never synced.'} Records are matched by Record ID, so repeat syncs update rows instead of duplicating them. If a sync fails, press Sync Now to retry.</p></div>
<div class=card><h3>Export history</h3><div class=w><table><tr><th>ID<th>User<th>Module<th>Format<th>Range<th>Records<th>When<th>Status<th>Destination</tr>${H.slice(0,25).map(e=>`<tr><td>${e.id}<td>${esc(e.by)}<br><span class=m>${e.role}</span><td>${esc(e.mod)}<td>${e.fmt}<td>${e.range}<td>${e.n}<td>${e.at.replace('T',' ').slice(0,16)}<td><span class="tag ${e.status==='Success'?'Paid':'Rejected'}">${e.status}</span><td>${e.dest?`<a href="${esc(e.dest)}" target=_blank rel=noopener>Sheet</a>`:''}</tr>`).join('')||'<tr><td class=m>No exports yet</tr>'}</table></div></div>`}
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.xf){X[t.dataset.xf]=t.value;X.pv=null;render()}else if(t.dataset.xc){t.checked?X.sel.add(t.dataset.xc):X.sel.delete(t.dataset.xc);X.pv=null;render()}});
document.addEventListener('click',async e=>{const t=e.target.closest('[data-x]');if(!t)return;const a=t.dataset.x;
if(a==='all'){Object.keys(CATS).filter(ok).forEach(k=>X.sel.add(k));render()}
else if(a==='pv'){if(!X.sel.size)return toast('Select at least one category');X.pv=pack();render()}
else if(a==='gsave'){try{localStorage.setItem('pc_gs',JSON.stringify({cid:$('#gcid').value.trim(),sid:$('#gsid').value.trim().replace(/.*\/d\/([^/]+).*/,'$1')}));await gtoken();toast('Google connected')}catch(x){toast(x.message)}render()}
else run(t,{xl:'Excel',csv:'CSV',pdf:'PDF',gs:'Google Sheets'}[a])});

function render(){$('#app').innerHTML=me&&!me.off?shell():authView()}
document.addEventListener('submit',async e=>{e.preventDefault();const f=e.target,k=f.dataset.f,v=Object.fromEntries(new FormData(f));
if(k==='setup'){if(S.users.length)return;const u={id:id('u'),emp:'EMP-001',name:v.name.trim(),email:v.email.trim().toLowerCase(),hash:await h(v.pw),role:'Super Admin'};S.users.push(u);me=u;log('Super Admin created');sv();try{sessionStorage.setItem('pc_me',u.id)}catch(x){}render()}
else if(k==='login'){if(Date.now()<lock)return toast('Too many attempts. Wait a moment.');const u=S.users.find(x=>x.email===v.email.trim().toLowerCase());if(u&&!u.off&&u.hash===await h(v.pw)){fails=0;me=u;log('Login');sv();try{sessionStorage.setItem('pc_me',u.id)}catch(x){}render()}else{if(++fails>=5){lock=Date.now()+30000;fails=0}toast('Invalid email or password')}}
else if(k==='leave'){if(v.to<v.from)return toast('End date is before start date');S.leave.push({id:id('l'),uid:me.id,...v,status:'Pending',at:new Date().toISOString()});log('Leave requested');sv();render()}
else if(k==='lead'){const n=String(S.leads.length+1).padStart(4,'0');S.leads.push({id:'L-'+n,...v,asg:v.asg,status:'Today Lead',created:new Date().toISOString(),by:me.id});log('Lead L-'+n+' created');sv();render()}
else if(k==='emp'){const em=v.email.trim().toLowerCase();if(S.users.some(u=>u.email===em))return toast('Email already exists');S.users.push({id:id('u'),emp:'EMP-'+String(S.users.length+1).padStart(3,'0'),name:v.name.trim(),email:em,hash:await h(v.pw),role:v.role,dept:v.dept,mgr:v.mgr});log('Employee added: '+em);sv();render()}});
document.addEventListener('click',async e=>{const t=e.target.closest('[data-tab],[data-act]');if(!t)return;if(t.dataset.tab){tab=t.dataset.tab;return render()}
const a=t.dataset.act,i=t.dataset.i,n=ist();
if(a==='out'){me=null;try{sessionStorage.removeItem('pc_me')}catch(x){}render()}
else if(a==='in'){if(S.att.some(r=>r.uid===me.id&&r.date===n.date))return toast('Already checked in today');t.disabled=true;const g=await gps(),n2=ist();S.att.push({id:id('a'),uid:me.id,date:n2.date,inAt:new Date().toISOString(),inT:n2.time,st:n2.secs>36000?'Late':'On Time',gps:g});log('Check-in '+n2.time);sv();render()}
else if(a==='ckout'){const r=S.att.find(r=>r.uid===me.id&&r.date===n.date&&!r.outAt);if(!r)return toast('No active check-in');r.outAt=new Date().toISOString();r.outT=n.time;r.early=n.secs<68400;r.hrs=((new Date(r.outAt)-new Date(r.inAt))/36e5).toFixed(2);log('Check-out '+n.time);sv();render()}
else if(a==='lv'){const l=S.leave.find(x=>x.id===i);if(l&&l.status==='Pending'){l.status=t.dataset.v;log('Leave '+l.status+': '+nm(l.uid));sv();render()}}
else if(a==='done'){const l=S.leads.find(x=>x.id===i);l.fu='';log('Reminder done '+i);sv();render()}
else if(a==='tog'){const u=S.users.find(x=>x.id===i);u.off=!u.off;log((u.off?'Deactivated ':'Activated ')+u.email);sv();render()}
else if(a==='bill'){const l=S.leads.find(x=>x.id===i);if(l.status!=='Converted')return toast('Billing only for converted leads');const am=$('#a'+i).value;if(am===''||+am<0)return toast('Enter the amount manually');const o=`${l.amt}/${l.pay}`;l.amt=+am;l.pay=$('#p'+i).value;l.pd=$('#d'+i).value;l.pm=$('#m'+i).value;log(`Billing ${i}: ${o} → ${l.amt}/${l.pay}`);sv();toast('Saved');render()}});
document.addEventListener('change',e=>{const t=e.target,d=t.dataset;
if(d.st){const l=S.leads.find(x=>x.id===d.st),ns=t.value,rs=$(`[data-rs=${d.st}]`).value.trim();if(ns==='Rejected'&&!rs){toast('Enter a rejection reason first');return render()}l.hist=(l.hist||[]);l.hist.push({from:l.status,to:ns,by:me.id,at:new Date().toISOString(),rs});l.status=ns;if(ns==='Rejected')l.reason=rs;log(`Lead ${l.id}: ${l.hist.at(-1).from} → ${ns}`);sv();render()}
else if(d.fu){const l=S.leads.find(x=>x.id===d.fu);l.fu=t.value;log('Reminder set '+l.id);sv();render()}
else if(d.rs){S.leads.find(x=>x.id===d.rs).reason=t.value;sv()}
else if(d.flt){lf=t.value;render()}else if(d.q){q=t.value;render()}});
setInterval(()=>{const c=$('#clk');if(c)c.textContent=ist().time},1000);render();
